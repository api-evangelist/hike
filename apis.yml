aid: hike
name: Hike
description: >-
  Hike Private Limited is a New Delhi consumer internet company founded in 2011 by Kavin
  Bharti Mittal. It is best known for Hike Messenger, launched in December 2012 and at its
  peak one of India's largest homegrown messaging apps, which the company retired in
  January 2021 to pivot into the Rush Gaming Universe — a mobile-first skill-gaming
  platform that layered Web3 ownership and play-to-earn mechanics over roughly fourteen
  casual titles. Hike raised approximately $261M across seven rounds from investors
  including SoftBank, Tencent, Tiger Global and Polygon, and reached unicorn valuation in
  2021. In September 2025, after India's Promotion and Regulation of Online Gaming Act
  banned real-money gaming, the founder announced a complete wind-down of the company and
  of Rush. As of August 2026 hike.in still resolves but serves an HTTP 502 behind an
  expired certificate, and every developer-facing subdomain is NXDOMAIN; the company
  publishes no API, developer portal, or machine-readable contract.
